name: CI - Build Check

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    - name: Install dependencies
      working-directory: ./console-frontend
      run: npm install
    
    - name: Build project
      working-directory: ./console-frontend
      run: npm run build
      env:
        VITE_API_URL: https://api.example.com/api
        VITE_ADMIN_API_URL: https://api.example.com/api/admin
        VITE_GOOGLE_CLIENT_ID: placeholder_client_id

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    - name: Install dependencies
      working-directory: ./console-backend
      run: npm install
    
    - name: Verify installation
      working-directory: ./console-backend
      run: node --version && npm --version
